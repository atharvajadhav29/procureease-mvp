<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ProcureEase | Source to Pay</title><style>
:root{--navy:#102a43;--blue:#1677ff;--bg:#f6f8fb;--green:#16803c;--amber:#a56000;--red:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px Inter,Arial,sans-serif;color:#172b4d}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#102a43,#1677ff)}.card{background:#fff;border-radius:16px;padding:28px;box-shadow:0 18px 60px #001b4433;width:min(440px,92vw)}h1,h2,h3,p{margin-top:0}.brand{font-size:26px;font-weight:800;color:var(--navy)}.brand i{color:var(--blue);font-style:normal}input,select,textarea{width:100%;padding:10px;border:1px solid #d7deea;border-radius:7px;margin:5px 0 14px;font:inherit}button{border:0;border-radius:7px;padding:10px 14px;background:var(--blue);color:#fff;font-weight:650;cursor:pointer}button.secondary{background:#eef4ff;color:#1259b4}button.danger{background:var(--red)}.demo{margin-top:16px;padding:12px;background:#f6f8fb;border-radius:8px;font-size:12px;line-height:1.7}.shell{display:flex;min-height:100vh}.side{width:240px;padding:22px 14px;background:var(--navy);color:#dce8f5}.side .brand{color:#fff;margin:0 8px 25px}.nav{display:block;width:100%;text-align:left;background:transparent;color:#c9d7e8;margin:3px 0}.nav.active,.nav:hover{background:#234765;color:#fff}.main{flex:1;padding:28px;max-width:1500px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.user{display:flex;gap:9px;align-items:center}.badge{border-radius:999px;padding:4px 9px;background:#e8f5ee;color:var(--green);font-size:12px;font-weight:bold}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.metric,.panel{background:#fff;border:1px solid #e3e9f2;border-radius:11px;padding:17px}.metric strong{font-size:27px;display:block;margin-top:8px}.panel{margin-top:16px}.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.table{width:100%;border-collapse:collapse;margin-top:10px}.table th,.table td{text-align:left;padding:11px 8px;border-bottom:1px solid #edf0f5}.table th{font-size:12px;color:#63738a}.status{font-size:12px;padding:4px 7px;border-radius:5px;background:#fff1d9;color:var(--amber);white-space:nowrap}.status.ok{background:#e8f5ee;color:var(--green)}.status.red{background:#ffebea;color:var(--red)}.modal{position:fixed;inset:0;background:#06172788;display:grid;place-items:center;padding:20px}.modal>div{background:#fff;border-radius:12px;padding:22px;width:min(600px,100%)}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}.notice{position:fixed;right:20px;bottom:20px;background:#102a43;color:white;padding:12px 16px;border-radius:8px;box-shadow:0 5px 18px #0003}@media(max-width:800px){.side{width:60px;padding:12px 4px}.side .brand{font-size:0}.nav{font-size:0;padding:14px 2px}.nav::first-letter{font-size:15px}.main{padding:16px}.grid{grid-template-columns:1fr 1fr}.split{grid-template-columns:1fr}}
</style></head><body><div id="app"></div><script>
const seed={prs:[{id:'PR-2026-041',title:'Laptops for Engineering',dept:'Engineering',amount:480000,status:'Approved',vendors:['NovaTech','Apex Systems']},{id:'PR-2026-042',title:'Office supplies Q3',dept:'Operations',amount:86000,status:'Pending approval',vendors:[]}],rfqs:[{id:'RFQ-2026-018',name:'Laptops for Engineering',vendors:2,status:'Responses received',best:'₹4,52,000'}],pos:[{id:'PO-2026-107',vendor:'NovaTech Solutions',amount:'₹4,52,000',status:'Issued',delivery:'12 Aug 2026'}],invoices:[{id:'INV-NT-884',vendor:'NovaTech Solutions',amount:'₹4,52,000',status:'Finance approval',po:'PO-2026-107'}],vendors:[{name:'NovaTech Solutions',category:'IT Hardware',rating:4.8,status:'Approved',email:'vendor@procureease.com'},{name:'Apex Systems',category:'IT Hardware',rating:4.5,status:'Approved',email:'sales@apex.com'},{name:'GreenLeaf Office',category:'Office supplies',rating:4.2,status:'Pending',email:'hello@greenleaf.com'}]};
let data=JSON.parse(localStorage.getItem('pe-data')||'null')||seed, user=JSON.parse(sessionStorage.getItem('pe-user')||'null'), view='dashboard';
function save(){localStorage.setItem('pe-data',JSON.stringify(data))}function money(n){return '₹'+Number(n).toLocaleString('en-IN')}function toast(t){document.body.insertAdjacentHTML('beforeend','<div class="notice">'+t+'</div>');setTimeout(()=>document.querySelector('.notice')?.remove(),2600)}
const accounts={'buyer@procureease.com':['Buyer@123','buyer','Ananya Sharma'],'vendor@procureease.com':['Vendor@123','vendor','Rahul Mehta'],'admin@procureease.com':['Admin@123','admin','Platform Admin']};
function login(){document.getElementById('app').innerHTML='<main class="login"><section class="card"><div class="brand">Procure<i>Ease</i></div><p>Source-to-pay, without the spreadsheet chaos.</p><form id="loginForm"><label>Email</label><input id="email" type="email" required placeholder="you@company.com"><label>Password</label><input id="password" type="password" required><button style="width:100%">Sign in</button></form><div class="demo"><b>Demo accounts</b><br>Buyer: buyer@procureease.com / Buyer@123<br>Vendor: vendor@procureease.com / Vendor@123<br>Admin: admin@procureease.com / Admin@123</div></section></main>';document.getElementById('loginForm').onsubmit=e=>{e.preventDefault();let a=accounts[email.value];if(!a||a[0]!==password.value)return toast('Incorrect demo credentials');user={role:a[1],name:a[2],email:email.value};sessionStorage.setItem('pe-user',JSON.stringify(user));view='dashboard';render()}}
function layout(content){let items=user.role==='vendor'?['dashboard','rfqs','quotations','orders','invoices','profile']:user.role==='admin'?['dashboard','vendors','approvals','analytics','settings']:['dashboard','requisitions','rfqs','quotations','orders','grn','invoices','analytics'];return '<div class="shell"><aside class="side"><div class="brand">Procure<i>Ease</i></div>'+items.map(x=>'<button class="nav '+(view===x?'active':'')+'" onclick="view=\''+x+'\';render()">'+x[0].toUpperCase()+x.slice(1)+'</button>').join('')+'</aside><main class="main"><header class="top"><div><h2>'+view[0].toUpperCase()+view.slice(1)+'</h2><span class="badge">'+user.role.toUpperCase()+' PORTAL</span></div><div class="user">'+user.name+' <button class="secondary" onclick="sessionStorage.clear();login()">Sign out</button></div></header>'+content+'</main></div>'}
function table(headers,rows){return '<table class="table"><thead><tr>'+headers.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.join('')+'</tbody></table>'}
function dashboard(){if(user.role==='vendor')return '<div class="grid">'+metric('Open RFQs','3','Respond before deadlines')+metric('Active POs','1','₹4,52,000')+metric('Invoices','1','Awaiting approval')+metric('Paid this quarter','₹8.6L','On-time: 100%')+'</div><section class="panel"><div class="row"><h3>Action required</h3><button onclick="view=\'rfqs\';render()">Review RFQs</button></div>'+table(['RFQ','Buyer','Due date','Action'],data.rfqs.map(r=>'<tr><td>'+r.id+'</td><td>ProcureEase Demo Co.</td><td>30 Jul 2026</td><td><button onclick="quote(\''+r.id+'\')">Submit quote</button></td></tr>'))+'</section>';return '<div class="grid">'+metric('Spend this quarter','₹28.4L','12% below budget')+metric('Open requisitions',data.prs.length,'1 needs approval')+metric('RFQs active',data.rfqs.length,'2 vendor responses')+metric('Invoices pending',data.invoices.length,'₹4.52L in workflow')+'</div><div class="split"><section class="panel"><h3>Recent requisitions</h3>'+table(['ID','Request','Status'],data.prs.map(p=>'<tr><td>'+p.id+'</td><td>'+p.title+'</td><td><span class="status '+(p.status==='Approved'?'ok':'')+'">'+p.status+'</span></td></tr>'))+'</section><section class="panel"><h3>Procurement pipeline</h3><p><b>₹12.8L</b> under sourcing</p><p><b>₹9.2L</b> purchase orders in delivery</p><p><b>₹4.52L</b> awaiting invoice approval</p><button onclick="view=\'analytics\';render()">View spend analytics</button></section></div>'}
function metric(a,b,c){return '<div class="metric"><span>'+a+'</span><strong>'+b+'</strong><small>'+c+'</small></div>'}
function requisitions(){return '<section class="panel"><div class="row"><h3>Purchase requisitions</h3><button onclick="modal(\'New purchase requisition\',\'<input id="title" placeholder="What do you need?" required><input id="dept" placeholder="Department" required><input id="amount" type="number" placeholder="Estimated amount" required>\',()=>{data.prs.push({id:\'PR-2026-0\'+(43+data.prs.length),title:title.value,dept:dept.value,amount:+amount.value,status:\'Pending approval\',vendors:[]});save();render();toast(\'Requisition submitted for approval\')})">+ New PR</button></div>'+table(['ID','Request','Department','Amount','Status','Action'],data.prs.map(p=>'<tr><td>'+p.id+'</td><td>'+p.title+'</td><td>'+p.dept+'</td><td>'+money(p.amount)+'</td><td><span class="status '+(p.status==='Approved'?'ok':'')+'">'+p.status+'</span></td><td>'+(p.status==='Approved'?'<button class="secondary" onclick="createRfq(\''+p.id+'\')">Create RFQ</button>':'<button class="secondary" onclick="approve(\''+p.id+'\')">Approve</button>')+'</td></tr>'))+'</section>'}
function rfqs(){return '<section class="panel"><div class="row"><h3>Request for quotations</h3><button onclick="view=\'requisitions\';render()">Create from approved PR</button></div>'+table(['RFQ','Requirement','Vendors','Best quote','Status','Action'],data.rfqs.map(r=>'<tr><td>'+r.id+'</td><td>'+r.name+'</td><td>'+r.vendors+'</td><td>'+r.best+'</td><td><span class="status ok">'+r.status+'</span></td><td><button onclick="selectQuote(\''+r.id+'\')">Compare & award</button></td></tr>'))+'</section>'}
function quotations(){return '<section class="panel"><h3>Quotation comparison</h3>'+table(['Vendor','Quoted price','Delivery','Warranty','Score','Decision'],['NovaTech Solutions','Apex Systems'].map((v,i)=>'<tr><td>'+v+'</td><td>'+money(i?468000:452000)+'</td><td>'+(i?'14':'10')+' days</td><td>3 years</td><td><b>'+(i?'86':'94')+'</b>/100</td><td><button onclick="award(\''+v+'\')">'+(i?'Review':'Award PO')+'</button></td></tr>'))+'</section>'}
function orders(){return '<section class="panel"><h3>Purchase orders</h3>'+table(['PO','Vendor','Amount','Delivery','Status','Action'],data.pos.map(p=>'<tr><td>'+p.id+'</td><td>'+p.vendor+'</td><td>'+p.amount+'</td><td>'+p.delivery+'</td><td><span class="status ok">'+p.status+'</span></td><td><button onclick="view=\'grn\';render()">Receive goods</button></td></tr>'))+'</section>'}
function invoices(){return '<section class="panel"><div class="row"><h3>Invoice workflow</h3>'+(user.role==='vendor'?'<button onclick="uploadInvoice()">Upload invoice</button>':'')+'</div>'+table(['Invoice','Vendor','PO','Amount','Status','Action'],data.invoices.map(i=>'<tr><td>'+i.id+'</td><td>'+i.vendor+'</td><td>'+i.po+'</td><td>'+i.amount+'</td><td><span class="status">'+i.status+'</span></td><td><button onclick="pay(\''+i.id+'\')">Advance workflow</button></td></tr>'))+'</section>'}
function vendors(){return '<section class="panel"><h3>Vendor verification</h3>'+table(['Vendor','Category','Rating','Status','Action'],data.vendors.map(v=>'<tr><td>'+v.name+'</td><td>'+v.category+'</td><td>★ '+v.rating+'</td><td><span class="status '+(v.status==='Approved'?'ok':'')+'">'+v.status+'</span></td><td><button onclick="vendorAction(\''+v.name+'\')">Approve / manage</button></td></tr>'))+'</section>'}
function analytics(){return '<div class="grid">'+metric('Savings realized','₹3.4L','vs. previous baseline')+metric('PO cycle time','4.2 days','Down 18%')+metric('Preferred vendor spend','76%','Target: 80%')+metric('Budget used','68%','₹41.2L remaining')+'</div><section class="panel"><h3>Spend by category</h3><p>IT Hardware <b>₹14.8L</b> ▰▰▰▰▰▰▰▰</p><p>Professional Services <b>₹8.2L</b> ▰▰▰▰▰</p><p>Office & Facilities <b>₹5.4L</b> ▰▰▰</p></section>'}
function grn(){return '<section class="panel"><h3>Goods receipt note</h3><p>PO-2026-107 — NovaTech Solutions — 20 laptops expected</p><button onclick="toast(\'GRN recorded: 20 accepted, quality inspection passed\')">Record full receipt</button></section>'}
function profile(){return '<section class="panel"><h3>Vendor profile & compliance</h3><p><b>NovaTech Solutions</b> · GSTIN 27AABCN0000A1Z5 · ★ 4.8</p><p>Documents: GST certificate, PAN, bank confirmation, ISO 9001 <span class="status ok">Verified</span></p><button onclick="toast(\'Profile saved\')">Update profile</button></section>'}
function settings(){return '<section class="panel"><h3>Organisation settings</h3><p>Approval matrix: Department head → Procurement → Finance</p><button onclick="toast(\'Approval matrix configuration saved\')">Edit approval matrix</button></section>'}
function render(){if(!user)return login();let c=({dashboard,requisitions,rfqs,quotations,orders,grn,invoices,vendors,analytics,profile,settings,approvals:requisitions}[view]||dashboard)();document.getElementById('app').innerHTML=layout(c)}
function modal(title,body,ok){document.body.insertAdjacentHTML('beforeend','<div class="modal"><div><h3>'+title+'</h3><form id="mform">'+body+'<div class="actions"><button type="button" class="secondary" onclick="this.closest(\'.modal\').remove()">Cancel</button><button>Save</button></div></form></div></div>');mform.onsubmit=e=>{e.preventDefault();ok();document.querySelector('.modal').remove()}}
function approve(id){let p=data.prs.find(x=>x.id===id);p.status='Approved';save();render();toast('PR approved and ready for RFQ')}function createRfq(id){let p=data.prs.find(x=>x.id===id);data.rfqs.push({id:'RFQ-2026-0'+(19+data.rfqs.length),name:p.title,vendors:3,status:'Invited',best:'—'});save();view='rfqs';render();toast('RFQ sent to selected vendors')}function quote(id){modal('Submit quotation','<input id="quoteAmt" type="number" placeholder="Quoted amount" required><input placeholder="Delivery days" value="10"><textarea placeholder="Terms and warranty">3 year warranty; Net 30</textarea>',()=>{toast('Quotation submitted to buyer')})}function selectQuote(){view='quotations';render()}function award(v){data.pos.push({id:'PO-2026-108',vendor:v,amount:'₹4,52,000',status:'Issued',delivery:'12 Aug 2026'});save();view='orders';render();toast('Purchase order issued and vendor notified')}function pay(id){let i=data.invoices.find(x=>x.id===id);i.status=i.status==='Paid'?'Paid':i.status==='Finance approval'?'Scheduled for payment':'Finance approval';save();render();toast('Invoice workflow advanced')}function uploadInvoice(){modal('Upload invoice','<input id="invoiceAmt" type="number" placeholder="Invoice amount" required><input type="file">',()=>{data.invoices.push({id:'INV-NT-'+(885+data.invoices.length),vendor:'NovaTech Solutions',amount:money(invoiceAmt.value),status:'Procurement review',po:'PO-2026-107'});save();render();toast('Invoice uploaded and routed for review')})}function vendorAction(n){let v=data.vendors.find(x=>x.name===n);v.status='Approved';save();render();toast(n+' approved')}render();
</script></body></html>
